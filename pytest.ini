[pytest]
testpaths = backend/tests
pythonpath = backend backend/app
env =
    REDIS_URL=redis://localhost:6379/0
    DATABASE__DB_URL=postgresql+asyncpg://user:pass@localhost:5432/db
    DATABASE__DB_HOST=localhost
    DATABASE__DB_PORT=5432
    DATABASE__DB_USER=user
    DATABASE__DB_PASSWORD=pass
    DATABASE__DB_NAME=db
