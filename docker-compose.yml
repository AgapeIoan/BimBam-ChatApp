services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    volumes:
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
