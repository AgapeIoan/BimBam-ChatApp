name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      SKIP_DB_INIT_ON_STARTUP: "1"
      REDIS_URL: redis://localhost:6379/0
      DATABASE__DB_URL: "sqlite+aiosqlite:///:memory:"
      DATABASE__DB_HOST: localhost
      DATABASE__DB_PORT: "5432"
      DATABASE__DB_USER: user
      DATABASE__DB_PASSWORD: pass
      DATABASE__DB_NAME: testdb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: isort
        run: isort --check-only .

      - name: Pytest
        run: pytest
